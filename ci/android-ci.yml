# CI GitHub Actions — copier ce fichier dans .github/workflows/android-ci.yml
# (le token d'automatisation n'a pas le scope « workflow » pour le pousser directement)

name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openeditvideo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

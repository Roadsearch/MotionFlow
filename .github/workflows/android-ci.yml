name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MotionFlow APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show tool versions
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MotionFlow-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MotionFlow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to the apk-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          cp "$APK" MotionFlow-debug.apk
          SHORT="${GITHUB_SHA::7}"
          NOTES="Build automatique de main (commit ${SHORT}). APK debug pour tests : autorise l'installation depuis des sources inconnues. Non valide sur appareil reel."
          git tag -f apk-latest "$GITHUB_SHA"
          git push -f origin refs/tags/apk-latest
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --notes "$NOTES" --prerelease
            gh release upload apk-latest MotionFlow-debug.apk --clobber
          else
            gh release create apk-latest MotionFlow-debug.apk --verify-tag --prerelease \
              --title "MotionFlow - APK debug le plus recent" --notes "$NOTES"
          fi
